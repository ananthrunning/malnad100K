  // ── COACH SUMMARY ──────────────────────────────────────────
  coachSummary: "The recovery week did exactly what a recovery week is for, and the data says so in four straight lines.\n\nStart with stride length: 0.70 metres on Tuesday, 0.71 on Thursday, 0.72 on Saturday, 0.73 on Sunday. A centimetre a session, in order, while cadence sat unmoved at 165 to 167. That is the whole week in one metric. Turnover was never the problem — the quads could not push, so the stride shortened to protect them, which is the body doing the right thing without being asked. When stride grows back at fixed cadence, force production is returning. Ground contact time came down alongside it, 294 milliseconds to 291.\n\nThe second line is where the legs stopped holding shape. On Tuesday the fade arrived at kilometre three, about twenty-five minutes in. On Thursday it moved out to kilometre five, about thirty-five minutes. By Saturday — ten kilometres, eighty-four minutes — there was no fade at all. The two quickest kilometres of that run were the sixth and the ninth, and the last was quicker than the first. Nine days after the fifty, the window in which he can hold form had gone from twenty-five minutes to as long as he cared to run.\n\nThen Sunday, which was the best session of the week and the one that settles it. Five point three kilometres at 8:18 per kilometre and 122 beats: the fastest pace, the longest stride and the joint-lowest heart rate of the week, produced on tired legs the morning after the longest run. Twenty-six point four five kilometres in total against a prescription of twenty to twenty-five — marginally over, on the right day, and worth stating rather than rounding away. Wednesday's strength session was skipped. In a week where the gym brief was upper body only, that costs nothing. From here it costs something.\n\nSo the absorption is done and the legs are back. Which brings us to the part of this week that was mine to get wrong, and I did.\n\nThe first Week 17 I wrote came in at forty-nine kilometres. He said it was stupid and he was right. I had anchored the step-up to the twenty-six of the recovery week as though that were his baseline, when it was a deliberate trough — his actual chronic load sits around fifty. Worse, I took the volume out of Saturday, shrinking the long run to protect a ten-kilometre event. The long run is the single thing that moves kilometre thirty-four. Trimming it is the precise error this campaign diagnosed eight days ago, dressed up as prudence and served straight back.\n\nThe second is older and on the same theme. In Week 1 he asked about the Nandi Monsoon Run and said he would love to do it. I recommended the ten kilometres over the half, judged purely on recovery cost fourteen days after an ultra, and never weighed what it was worth as training. A twenty-one kilometre race with five hundred and thirty metres of ascent was one of the few sessions on the entire calendar that would have delivered serious vertical, and Malnad asks for three thousand four hundred and ten. He is registered for neither in the end, which turns out to be the better outcome: on Sunday he goes to Nandi on his own terms and runs the actual summit road instead of a loop at the base.\n\nWeek 17 is sixty-four kilometres with a forty-kilometre weekend and real climbing in it. Threshold returns as a protected slot rather than the first thing dropped when the week gets busy. This is the shape Phase 2 was always meant to have, and it is arriving late.",
